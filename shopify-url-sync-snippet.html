<iframe id="kpop-iframe" src="https://kpopshop.netlify.app/" width="100%" style="border:none;display:block;" height="800"></iframe>
<script>
  (function () {
    const iframe = document.getElementById('kpop-iframe');
    if (!iframe) return;

    function normalizePath(path) {
      if (!path || typeof path !== 'string') return '/';
      if (path.startsWith('/#/')) return path.slice(2);
      if (path.startsWith('#/')) return path.slice(1);
      return path.charAt(0) === '/' ? path : '/' + path;
    }

    function currentReactPath() {
      // Refresh-safe : Shopify sert toujours la home, React lit la route dans le hash.
      if (window.location.hash && window.location.hash.startsWith('#/')) {
        return normalizePath(window.location.hash);
      }
      return normalizePath(window.location.pathname + window.location.search);
    }

    function toShopifyUrl(path) {
      const cleanPath = normalizePath(path);
      return cleanPath === '/' ? '/' : '/#' + cleanPath;
    }

    function sendCurrentPathToReact(replace = true) {
      if (!iframe.contentWindow) return;
      iframe.contentWindow.postMessage({
        type: 'kpopshop:navigate',
        source: 'shopify-parent',
        path: currentReactPath(),
        replace
      }, '*');
    }

    window.addEventListener('message', (e) => {
      const data = e.data;

      // Hauteur automatique de l'iframe
      if (data?.type === 'kpopshop-height') {
        iframe.style.height = data.height + 'px';
        return;
      }

      // Quand React est prêt, on lui donne l'URL Shopify actuelle
      if (data?.type === 'kpopshop:ready' && data.source === 'react-app') {
        sendCurrentPathToReact(true);
        return;
      }

      // Quand React change de page, on change l'URL visible Shopify sans casser le refresh
      if (data?.type === 'kpopshop:route-change' && data.source === 'react-app' && typeof data.path === 'string') {
        const nextPath = normalizePath(data.path);
        if (nextPath !== currentReactPath()) {
          window.history.pushState({ kpopshop: true, path: nextPath }, '', toShopifyUrl(nextPath));
        }
      }
    });

    // Bouton retour / suivant du navigateur
    window.addEventListener('popstate', () => {
      sendCurrentPathToReact(false);
    });
  })();
</script>
