[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # URL du backend Render
  VITE_API_URL = "https://backend-kpop-9wn7.onrender.com/api"
  NODE_ENV = "production"

# Redirects pour React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Headers CORS pour communiquer avec le backend
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://backend-kpop-9wn7.onrender.com"

# Cache pour assets statiques
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"