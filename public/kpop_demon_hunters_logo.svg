      <stop offset="100%" style="stop-color:#8B008B;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#FF69B4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#8B008B;stop-opacity:0.8"/>
    </linearGradient>
  </defs>

  <!-- Background circle glow -->
  <circle cx="340" cy="260" r="200" fill="url(#glowGrad)" opacity="0.3" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.3;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  
